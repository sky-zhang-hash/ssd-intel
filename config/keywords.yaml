  - name: 价格
    weight: 0.20      # 弱化：只作为背景
    core: false
    terms:
      - 涨价
      - 跌价
      - 报价
      - 合约价
      - 现货价
      - 价格
      - 美元
      - 出货量

# 低于这个分数的条目直接丢弃（0.5 ≈ 信源权重 0.5 的源命中一个核心类）
min_score: 0.45

# --------------------------------------------------------------
# 锚点：**只匹配标题**，必须命中至少一个，否则不管分数多高都丢弃。
#
# 为什么需要：像「高通发布骁龙平台」「OPPO 平板开售」「华擎主板上市」这类稿子
# 也含「发布」「AI」「新品」，光靠分类权重加总会误收。
#
# 为什么只匹配标题：主板评测的摘要里常写「支持两个 M.2 SSD 插槽」，
# 拿摘要匹配会把整篇主板文章放进来 —— 实测踩过。
#
# 词表要求：
#   · 「存储」可以留（标题里出现通常是存储行业新闻），但只能靠标题判定
#   · 别放「PCIe」「M.2」—— 主板评测标题里也有
#   · 别放「controller」—— 会命中风扇 controller、量子 controller
# --------------------------------------------------------------
anchors:
  - SSD
  - 固态硬盘
  - 闪存
  - NAND
  - eSSD
  - UFS
  - 主控
  - 颗粒
  - HBM
  - DRAM
  - 存储芯片
  - 存储市场
  - Xtacking
  - BiCS
  - V-NAND
  - 致钛
  - NVMe

# --------------------------------------------------------------
# 排除：命中任一个直接丢弃，优先级高于一切。
# 只放明确的噪音，别放「手机」「电脑」这种会把 UFS / AI PC 一起杀掉的词。
# --------------------------------------------------------------
exclude:
  - 招聘
  - 抽奖
  - 优惠券
  - 显卡驱动
  - 显示器评测
  - 耳机
