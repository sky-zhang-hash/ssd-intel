# ==============================================================
# 分类与打分规则
#
# score = Σ(命中类别的 weight) × 信源 weight
# 价格类刻意给低权重 —— 你的要求是「弱化价格，侧重产品」。
#
# 只有命中 core: true 的类别，条目才会进入日报。
# 仅命中价格类、且没有其它类别的条目会被丢弃。
# ==============================================================

categories:
  - name: 主控
    weight: 1.00
    core: true
    terms:
      - 主控
      - controller
      - 慧荣
      - Silicon Motion
      - SMI
      - 群联
      - Phison
      - 联芸
      - Maxio
      - 英韧
      - InnoGrit
      - 得一微
      - Yeestor
      - Marvell
      - 点序
      - 华澜微
      - 自研主控

  - name: 颗粒
    weight: 0.90
    core: true
    terms:
      - NAND
      - 颗粒
      - TLC
      - QLC
      - SLC
      - 3D NAND
      - 堆叠
      - 层数
      - Xtacking
      - BiCS
      - V-NAND
      - 晶圆
      - die

  - name: 封装
    weight: 0.90
    core: true
    terms:
      - 封装
      - 封测
      - 力成
      - 南茂
      - 华泰
      - 日月光
      - Amkor
      - 长电
      - 通富
      - 华天
      - 沛顿
      - SiP
      - BGA
      - CoB
      - 倒装
      - 先进封装

  - name: 产品
    weight: 0.85
    core: true
    terms:
      - PCIe
      - NVMe
      - U.2
      - E3.S
      - E1.S
      - UFS
