# ==============================================================
# SSD 情报日报 · 微信公众号清单
#
# ⚠️ 实测结论（2026-11-22，见 scripts/measure_wechat.py）：
#   搜索接口本身可用（14 个词稳定拿 130+ 条），但**时效性不达标** ——
#   68 条结果里 7 天内的只有 1 条（1.5%），30 天以上的占 95.6%。
#   原因是搜狗按相关度排序，时间排序参数 tsn=1 实测失效（返回落地页），
#   ft/et 时间过滤参数也被忽略。所以搜狗这一路只能当「背景检索」，
#   撑不起每日新闻。真要做每日公众号，必须上 WeRSS（见 README L2）。
#
# 现状（已实测）：
#   · 搜狗微信「按账号列文章」不可用 —— 查 SSDFans 返回
#     「暂无相关的官方认证订阅号」，未认证的服务号/个人号搜不到。
#   · 「按关键词搜文章」可用，结果里带公众号名和发布时间
#     （公众号名在 span.all-time-y2，时间在 timeConvert('...')）。
#   · 文章真链藏在 /link?url=... 后面，请求十几条就触发 IP 级反爬，
#     且持续一段时间，所以只克制还原少量。
#
# 三级策略（见 src/ssdintel/fetch.py 的 collect_wechat / resolve_items）：
#   L1 关键词轮询（免费、今天就能跑、但只适合做背景）
#   L2 自建 WeRSS / WeWe RSS（需微信读书扫码，覆盖全、有真链和全文）
#   L3 手动补录（100% 可靠，每天 2 分钟）
#
# 已排除的替代方案（都实测过，别再试）：
#   · wechat2rss 公开服务：395 个号，但一个存储号都没有（偏安全/开发）
#   · Google News RSS：本机连不上（ConnectTimeout）
#   · Bing 网页 RSS：可以拿结果，但 filters 时间过滤在 RSS 模式下被忽略
#   · 百度新闻：返回 2.6KB 跳转页，无结果
#
# tier 只是分级标注，不强制；keywords 是这个号的重点方向，
# 用于 L1 阶段构造搜索词和 L3 阶段做匹配。
# ==============================================================

